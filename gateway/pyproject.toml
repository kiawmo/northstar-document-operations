[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-llm-gateway"
version = "1.0.0"
description = "Schema-constrained LLM gateway with a restricted Codex CLI provider"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{name = "Kiasha Mohammadi"}]
readme = "README.md"
dependencies = ["fastapi==0.143.0", "pydantic==2.14.0", "uvicorn==0.54.0", "httpx==0.28.1", "jsonschema==4.25.1", "psutil==7.0.0"]

[project.optional-dependencies]
test = ["pytest==9.0.3", "ruff==0.14.0"]

[project.scripts]
llm-gateway = "llm_gateway.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]
