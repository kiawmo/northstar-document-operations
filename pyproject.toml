[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-document-operations"
version = "1.0.0"
description = "Durable invoice and inbox automation with human review"
requires-python = ">=3.12"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [{name = "Kiasha Mohammadi"}]
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/kiawmo/northstar-document-operations"
Issues = "https://github.com/kiawmo/northstar-document-operations/issues"

[project.scripts]
northstar = "docops.__main__:main"

[tool.setuptools.packages.find]
include = ["docops*"]

[tool.setuptools.package-data]
docops = ["static/*"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"docops/api.py" = ["B008"]
