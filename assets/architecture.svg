<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="820" viewBox="0 0 1360 820"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="#6890a3"/></marker></defs><rect width="1360" height="820" fill="#f3f7fa"/><g font-family="Segoe UI,Arial,sans-serif" fill="#19323d"><text x="60" y="76" font-size="36" font-weight="600">Intelligent document &amp; inbox operations</text><text x="60" y="113" font-size="17" fill="#607680">A durable Python pipeline from incoming source to an auditable decision.</text><g stroke="#6890a3" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M282 269H335"/><path d="M562 269H614"/><path d="M842 269H895"/><path d="M1010 339V420"/><path d="M895 469H845"/><path d="M618 469H565"/><path d="M448 519V601"/><path d="M562 650H615"/><path d="M844 650H896"/><path d="M1010 520V570H585V500H562"/><path d="M334 650H174V342" stroke-dasharray="7 6"/></g><g><rect x="60" y="196" width="222" height="146" rx="10" fill="#163747"/><text x="82" y="233" fill="white" font-size="20" font-weight="600">Receive &amp; persist</text><text x="82" y="268" fill="#c0d9e5" font-size="16">Upload · API · email</text><text x="82" y="300" fill="#c0d9e5" font-size="14">5 MB / signatures / key</text><rect x="335" y="196" width="227" height="146" rx="10" fill="white" stroke="#bdcdd6"/><text x="357" y="233" font-size="20" font-weight="600">Durable queue</text><text x="357" y="268" fill="#607680" font-size="16">PostgreSQL / SQLite WAL</text><text x="357" y="300" fill="#607680" font-size="14">Atomic claims + lease tokens</text><rect x="615" y="196" width="227" height="146" rx="10" fill="white" stroke="#bdcdd6"/><text x="637" y="233" font-size="20" font-weight="600">Extract source</text><text x="637" y="268" fill="#607680" font-size="16">PDF text / Tesseract OCR</text><text x="637" y="300" fill="#607680" font-size="14">Bounded pages + timeouts</text><rect x="895" y="196" width="227" height="146" rx="10" fill="white" stroke="#bdcdd6"/><text x="917" y="233" font-size="20" font-weight="600">Invoice provider</text><text x="917" y="268" fill="#607680" font-size="16">Codex gateway / fixture</text><text x="917" y="300" fill="#607680" font-size="14">Strict structured output</text><rect x="895" y="420" width="227" height="100" rx="10" fill="#deedf3" stroke="#aac7d5"/><text x="917" y="457" font-size="20" font-weight="600">Verify business rules</text><text x="917" y="490" fill="#607680" font-size="14">Decimal math + duplicate keys</text><rect x="615" y="420" width="227" height="100" rx="10" fill="#fff2d9" stroke="#e6c88c"/><text x="637" y="457" font-size="20" font-weight="600">Human decision</text><text x="637" y="490" fill="#8c641e" font-size="14">Correct · approve · reject · retry</text><rect x="335" y="420" width="227" height="100" rx="10" fill="#e7f3ed" stroke="#b0d2c0"/><text x="357" y="457" font-size="20" font-weight="600">Accounting register</text><text x="357" y="490" fill="#40735a" font-size="14">One invoice per business key</text><rect x="335" y="600" width="227" height="101" rx="10" fill="white" stroke="#bdcdd6"/><text x="357" y="638" font-size="20" font-weight="600">Transactional outbox</text><text x="357" y="673" fill="#607680" font-size="14">Accepted invoice + ack commit</text><rect x="615" y="600" width="227" height="101" rx="10" fill="white" stroke="#bdcdd6"/><text x="637" y="638" font-size="20" font-weight="600">Delivery adapter</text><text x="637" y="673" fill="#607680" font-size="14">Reserved delivery + reconciliation</text><rect x="895" y="600" width="227" height="101" rx="10" fill="#163747"/><text x="917" y="638" fill="white" font-size="20" font-weight="600">Operations dashboard</text><text x="917" y="673" fill="#c0d9e5" font-size="14">Source · review · trace · metrics</text><text x="63" y="564" fill="#607680" font-size="14">Backoff · lease recovery</text><text x="63" y="587" fill="#607680" font-size="14">Stale-worker fencing</text><text x="620" y="592" fill="#40735a" font-size="15">Validated invoices register automatically</text><text x="620" y="409" fill="#8c641e" font-size="14">Only uncertain records await review</text></g><path d="M60 750H1300" stroke="#bdcdd6"/><text x="60" y="784" fill="#607680" font-size="14">Durable document operations · Synthetic demonstration data · All state changes include a traceable audit event</text></g></svg>
