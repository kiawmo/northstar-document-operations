<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"><rect width="1280" height="640" fill="#f3f7fa"/><g font-family="Segoe UI,Arial,sans-serif" fill="#19323d"><text x="55" y="72" font-size="36" font-weight="600">Failure is a visible part of the workflow.</text><text x="55" y="111" fill="#607680" font-size="17">An executed synthetic recovery sequence — never a hidden happy-path assumption.</text><path d="M180 232H1090" stroke="#9bb8c6" stroke-width="3"/><g><circle cx="180" cy="232" r="12" fill="#a54447"/><circle cx="482" cy="232" r="12" fill="#a46109"/><circle cx="784" cy="232" r="12" fill="#a46109"/><circle cx="1090" cy="232" r="12" fill="#246c51"/></g><g font-size="19" font-weight="600"><text x="90" y="193">Provider HTTP 429</text><text x="402" y="193">Backoff + audit</text><text x="691" y="193">Provider HTTP 503</text><text x="1005" y="193">Attempt 3 succeeds</text></g><g font-size="14" fill="#607680"><text x="95" y="275">Durable source remains intact</text><text x="407" y="275">A scheduled retry is persisted</text><text x="700" y="275">One more bounded retry</text><text x="1007" y="275">One accounting record</text></g><rect x="55" y="350" width="1170" height="182" rx="10" fill="white" stroke="#bdcdd6"/><g font-size="21" font-weight="600"><text x="83" y="392">Worker exits unexpectedly</text><text x="460" y="392">Database becomes unavailable</text><text x="846" y="392">An invoice does not add up</text></g><g font-size="15" fill="#607680"><text x="83" y="428">Actual subprocess exit code 23.</text><text x="83" y="459">Lease expiry requeues the durable job.</text><text x="83" y="490">A stale claim cannot commit a result.</text><text x="460" y="428">Actual write lock / connection refusal.</text><text x="460" y="459">Stored jobs remain available after recovery.</text><text x="460" y="490">The worker resumes the original source.</text><text x="846" y="428">Decimal validation flags the mismatch.</text><text x="846" y="459">A reviewer corrects fields with a reason.</text><text x="846" y="490">Approval produces an auditable decision.</text></g><text x="55" y="591" font-size="14" fill="#607680">Inspect evidence/chaos-result.json and the live activity trail. All demonstrated failures and recoveries are labeled synthetic tests.</text></g></svg>
